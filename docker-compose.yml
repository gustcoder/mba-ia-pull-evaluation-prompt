services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_app_evaluation_prompt
    volumes:
      - .:/src
      - /src/__pycache__
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    # Override command to keep container running
    command: tail -f /dev/null
